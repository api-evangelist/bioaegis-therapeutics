aid: bioaegis-therapeutics
name: BioAegis Therapeutics
description: >-
  BioAegis Therapeutics, Inc. is a privately held, clinical-stage biopharmaceutical company
  headquartered at the NJ Bioscience Center in North Brunswick, New Jersey. Founded in 2011 around
  the discovery work of the late Dr. Thomas P. Stossel at Harvard Medical School and Brigham and
  Women's Hospital, the company develops recombinant human plasma gelsolin (rhu-pGSN) — a protein
  replacement therapy built on plasma gelsolin (pGSN), an abundant naturally occurring human blood
  protein that acts as a master regulator of the innate immune response by keeping inflammation
  localized to the site of injury and boosting the body's ability to clear pathogens. Its lead
  programme, BTI-203, is a 600-patient, 75-site, 13-country randomized double-blind
  placebo-controlled Phase 2 study of rhu-pGSN in moderate-to-severe acute respiratory distress
  syndrome (ARDS), supported by a $20M BARDA DRIVe contract (75A50123C00067); a second Phase 2
  programme targets inflammasome-driven decompression sickness under a U.S. Navy Office of Naval
  Research contract with the University of Maryland School of Medicine. The FDA has granted Fast
  Track designation for both ARDS and DCS indications. BioAegis holds an exclusive worldwide
  license from Brigham and Women's Hospital and more than 40 issued patents spanning inflammatory
  disease, infection, renal failure, neurologic disease and frailty. BioAegis Therapeutics runs no
  developer program and publishes no product API, developer portal or API documentation. The only
  machine-readable surface reachable without credentials is the WordPress REST content API behind
  www.bioaegistherapeutics.com, catalogued here.
