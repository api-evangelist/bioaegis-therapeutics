apis:
- aid: bioaegis-therapeutics:bioaegis-therapeutics-content-api
  name: BioAegis Therapeutics Content API
  description: >-
    The anonymously readable WordPress REST API behind www.bioaegistherapeutics.com. It exposes the
    153 published posts (94 News press releases, 34 Publications, 9 Events, 6 Clinical Advisory
    Board profiles, 5 Leadership profiles, 4 Board profiles and 2 Feature entries), the 14
    corporate pages (Home, About Us, Our Science, Our Platform, BTI-203 Clinical Trial, FAQs,
    Publications, News, Careers, Contact Us, Expanded Access Policy, Code of Ethics/Conduct, Terms
    of Use, Privacy Policy), the 247-item media library, the 10 registered categories, the post
    types, taxonomies and statuses, cross-content search, the oEmbed 1.0 provider endpoint, and the
    Yoast SEO head renderer that carries the site's schema.org JSON-LD graph. Unlike many WordPress
    corporate sites, `content.rendered` and `excerpt.rendered` ARE populated on both posts and
    pages, so this surface yields full prose as well as identity, hierarchy, dates and SEO
    metadata. Two things a consumer must know. First, the site is fronted by a Sucuri CloudProxy
    WAF: /wp/v2/users returns a 403 HTML interstitial from the edge rather than a JSON error, so
    author identities are not resolvable and `author` on every record is an unresolvable integer.
    Second, the `post_tag` taxonomy is registered but empty (0 terms) — all classification is
    carried by the hierarchical `category` taxonomy. This is not a developer product BioAegis
    Therapeutics markets; it is the site's own content surface, registered at /wp-json/ and
    verified to return data without credentials. The OpenAPI in this repo is derived from the
    published route index and covers only the operations that were confirmed to answer anonymously.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://www.bioaegistherapeutics.com/wp-json
