  x-contract-provenance: >-
    Derived by the API Evangelist enrichment pipeline from the WordPress REST route index the site
    publishes at https://www.bioaegistherapeutics.com/wp-json/ — 308 routes across the namespaces
    oembed/1.0, redirection/v1, yoast/v1, elementor-one/v1, duplicate-post/v1, elementor/v1,
    elementor-pro/v1, monsterinsights/v1, astra/v1, elementor/v1/documents, elementor-ai/v1,
    elementor/v1/feedback, nps-survey/v1, wp/v2, wp-site-health/v1, wp-block-editor/v1 and
    wp-abilities/v1 — and verified against live anonymous responses on 2026-08-07. Only the 23
    operations that returned data without credentials are modelled. Notably the site registers the
    WordPress Abilities API (`wp-abilities/v1`), an agent-facing capability registry, but
    /wp-abilities/v1/abilities and /wp-abilities/v1/categories both return 401 rest_forbidden
    anonymously, so no agent surface is claimed here. /wp/v2/users and /wp/v2/users/me return 403
    from the Sucuri WAF, /wp/v2/settings returns 401 rest_forbidden, and themes, plugins, menus,
    menu-locations, sidebars, widget-types, templates, template-parts, global-styles, block-types,
    block-patterns, pattern-directory, font-collections, revisions and the oEmbed proxy all return
    401. /wp/v2/comments, /wp/v2/tags, /wp/v2/blocks and /wp/v2/navigation return 200 with empty
    collections. BioAegis Therapeutics publishes no developer documentation, no API reference, no
    getting-started guide and no support channel for this surface, so no
    Documentation/APIReference/GettingStarted pointers are emitted; the humanURL above is the
    upstream WordPress REST handbook that defines the wp/v2 contract.
