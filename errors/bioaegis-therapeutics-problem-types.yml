- code: rest_pattern_directory_cannot_view
  status: 401
  title: Cannot view pattern directory
  observed_at: /wp/v2/pattern-directory/patterns
  detail: The remote WordPress.org pattern-directory proxy requires an authenticated capability.
  remediation: None available to a third party.
  verified: true
- code: rest_cannot_manage_widgets
  status: 401
  title: Cannot manage widgets
  observed_at: /wp/v2/sidebars, /wp/v2/widget-types
  detail: Widget and sidebar resources require an authenticated administrative capability.
  remediation: None available to a third party.
  verified: true
- code: rest_cannot_read
  status: 401
  title: Cannot read resource
  observed_at: /wp/v2/font-collections, /wp/v2/posts/{id}/revisions
  detail: >-
    Revision history and font collections require an authenticated capability. Revisions being
    closed is why the `version-history` link relation on every post is unresolvable anonymously.
  remediation: None available to a third party.
  verified: true
- code: rest_cannot_export_templates
  status: 401
  title: Cannot export templates
  observed_at: /wp-block-editor/v1/export
  detail: Template export requires an authenticated administrative capability.
  remediation: None available to a third party.
  verified: true
non_json_errors:
- surface: /wp/v2/users, /wp/v2/users/me
  status: 403
  media_type: text/html
  emitted_by: 'Sucuri CloudProxy WAF (Server: Sucuri/Cloudproxy)'
  detail: >-
    The user-enumeration endpoints are blocked at the edge, before WordPress sees the request. The
    response is a full HTML interstitial referencing cdn.sucuri.net stylesheets, not a WordPress
    JSON error. This is a deliberate, and correct, hardening choice — but it means the error
    contract is not uniform. A consumer MUST branch on Content-Type before parsing.
  consequence: >-
    Author identity is unresolvable on this surface. Every post and page returns an integer
    `author` field (observed value 2) that cannot be dereferenced, and `_embed` on the author link
    relation returns an error stub.
  verified: true
- surface: /astra/v1/get-sites
  status: 502
  media_type: text/html
  detail: The Astra theme's remote-sites route returns a bad gateway anonymously rather than an auth error.
  verified: true
- surface: /elementor/v1/globals
  status: 500
  detail: The Elementor globals route returns a server error anonymously rather than an auth error.
  verified: true
gaps:
- issue: >-
    No RFC 9457 problem+json. There is no `type` URI a client can dereference for documentation, no
    stable `title`, and no `instance`, so errors cannot be linked to a reference — because there is
    no reference to link to.
- issue: >-
    401 is used where 403 is meant. Every capability refusal returns 401 Unauthorized to an
    anonymous caller for whom no credential exists, rather than 403 Forbidden. A client
    implementing standard retry-with-credentials logic will loop.
- issue: >-
    The error contract is not uniform across the surface — one endpoint answers in HTML from the
    edge. Any generic client must sniff Content-Type.
docs: null
docs_note: >-
  BioAegis Therapeutics publishes no error reference. Upstream codes are documented informally
  across the WordPress REST handbook at https://developer.wordpress.org/rest-api/.
