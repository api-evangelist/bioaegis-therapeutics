source: live GET probes of every /.well-known/ path against the content-API host
description: >-
  Result of probing the RFC-registered /.well-known/ discovery surface on the only host BioAegis
  Therapeutics operates, www.bioaegistherapeutics.com. Every path returned 404. The host is a
  WordPress site behind a Sucuri CloudProxy WAF; it answers unknown paths with the theme's own 404
  HTML page (a ~92KB rendered document, distinct in size from the ~143KB homepage), not a catch-all
  200, so these are true misses rather than SPA false negatives. Absence of a record is valid data
  — BioAegis Therapeutics publishes no security.txt, no OAuth or OpenID discovery document, no
  api-catalog, no AI plugin manifest and no agent card. No raw files were saved because nothing
  returned 200.
