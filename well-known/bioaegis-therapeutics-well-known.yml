    Yoast-generated. Declares `User-agent: *` with an empty `Disallow:` — nothing is disallowed —
    and points at the sitemap index. Crawling is explicitly permitted, including by agents.
- path: /sitemap_index.xml
  status: 200
  note: >-
    Yoast sitemap index with four child sitemaps — post-sitemap.xml (lastmod 2026-04-21),
    page-sitemap.xml (2026-05-15), category-sitemap.xml (2026-04-21) and author-sitemap.xml
    (2025-11-19). The author sitemap publicly exposes three author slugs (admin, serrao6, sserrao)
    that the REST API blocks at the WAF — the two surfaces disagree about whether authorship is
    public.
